# fairagro
name: Continuous Integration

on:
  pull_request: { branches: ["fairagro"] }
  push:
    branches: ["fairagro"]
    tags: ["*"]
env:
  KUBECONFIG: .kube/config
  KUBECONFIG_FILE: ${{ secrets.KUBECONFIG }}
  GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  build:
    name: "Build Image"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - id: generate-image-tag
        name: Generate Image Tag
        env:
          ref_name: "${{ github.ref_name }}"
          head_ref: "${{ github.head_ref }}"
        run: |
          head_ref="${head_ref/\//-}"
          ref_name="${head_ref:-fairagro}"
          combined_tag="${ref_name}-${GITHUB_SHA}"
          echo "::set-output name=imageTag::${combined_tag#v}"
      - name: Login to Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.SEMLOOKP_WIDGETS_TOKEN }}
      - uses: actions/setup-node@v3
        with:
          node-version: "24.x"
      - run: npm install
        working-directory: .
      - run: npm run style:format
        env:
          CI: false
        working-directory: .
      - run: npm run build
        env:
          CI: false
          AGROPORTAL_API_KEY: ${{ secrets.AGROPORTAL_API_KEY }}
          BIODIVPORTAL_API_KEY: ${{ secrets.BIODIVPORTAL_API_KEY }}
          BIOPORTAL_API_KEY: ${{ secrets.BIOPORTAL_API_KEY }}
          EARTHPORTAL_API_KEY: ${{ secrets.EARTHPORTAL_API_KEY }}
          ECOPORTAL_API_KEY: ${{ secrets.ECOPORTAL_API_KEY }}
          LOVPORTAL_API_KEY: ${{ secrets.LOVPORTAL_API_KEY }}
        working-directory: .
      - name: Build and Push Frontend
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.generate-image-tag.outputs.imageTag }}
            ghcr.io/${{ github.repository }}:${{ github.event.pull_request.head.sha || github.sha }}
  deploy_fairagro:
    needs: build
    if: github.ref == 'refs/heads/fairagro'
    runs-on: ubuntu-latest
    steps:
      - id: generate-image-tag
        name: Generate Image Tag
        env:
          ref_name: "${{ github.ref_name }}"
          head_ref: "${{ github.head_ref }}"
        run: |
          head_ref="${head_ref/\//-}"
          ref_name="${head_ref:-fairagro}"
          combined_tag="${ref_name}-${GITHUB_SHA}"
          echo "::set-output name=imageTag::${combined_tag#v}"
      - uses: actions/checkout@v2
      - run: |
          mkdir -p .kube
          echo "${{ env.KUBECONFIG_FILE }}" > $KUBECONFIG
      - uses: stefanprodan/kube-tools@v1
        with:
          helmv3: 3.12.0
          command: |
            kubectl get nodes
            helmv3 repo add semlookp-deployment https://zbmed.github.io/semlookp-deployment/
            helmv3 repo update
            helmv3 upgrade zbmed-ts-fairagro \
            --install \
            --namespace='zbmed-ts-fairagro' \
            --set-json='images.ui="ghcr.io/${{ github.repository }}:${{ github.event.pull_request.head.sha || github.sha }}"' \
            --set-json='ingress.dns="semlookp-ui-fairagro.qa.km.k8s.zbmed.de"'  \
            --set-json='ingress.path="/"'  \
            semlookp-deployment/zbmed-ts-fairagro
